<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: 'Segoe UI', Arial, sans-serif; background-color: #1a1a2e; margin: 0; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background: linear-gradient(135deg, #fffef0 0%, #f0f8ff 100%); border-radius: 20px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.3);">
        <div style="background: linear-gradient(135deg, #c41e3a 0%, #8b0000 100%); color: white; padding: 30px; text-align: center; border-bottom: 4px solid #ffd700;">
            <h1 style="margin: 0; font-size: 28px;">{% block heading %}{% endblock %}</h1>
        </div>
        <div style="padding: 30px; color: #555; line-height: 1.6;">
            {% block content %}{% endblock %}
            {% if link %}
            <div style="text-align: center; margin: 30px 0 10px;">
                <a href="{{ link }}"
                   style="display: inline-block; background: linear-gradient(135deg, #c41e3a 0%, #8b0000 100%); color: white; padding: 15px 40px; text-decoration: none; border-radius: 25px; font-weight: bold; font-size: 16px;">
                    {% block button %}Open {{ site_name }}{% endblock %}
                </a>
            </div>
            {% endif %}
        </div>
        <div style="background: linear-gradient(135deg, #006400 0%, #1a1a2e 100%); color: white; padding: 20px; text-align: center; border-top: 3px solid #ffd700;">
            <p style="margin: 0; opacity: 0.9;">🎄 {{ site_name }} 🎄</p>
        </div>
    </div>
</body>
</html>
