{% extends "base.html" %}

{% block title %}Add Item - {{ site_name }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1><i data-lucide="circle-plus"></i> Add to Your Wishlist</h1>
    <p class="text-white-50 mb-0">{{ wishlist.event.name }} ({{ wishlist.event.year }})</p>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="christmas-card">
            <div class="card-body">
                {% include "wishlist/_item_form.html" %}
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/item_form.js') }}"></script>
{% endblock %}
