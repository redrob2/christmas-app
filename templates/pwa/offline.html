<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#121a33">
    <title>Offline - {{ site_name }}</title>
    {# Self-contained: this page is shown with no connection, so no outside fonts or scripts #}
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: radial-gradient(circle at 50% 35%, #24346a, #121a33 70%);
            color: #fffdf7;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }
        main { max-width: 360px; }
        svg { width: 96px; height: 96px; }
        h1 { font-size: 1.6rem; margin: 18px 0 8px; }
        p { color: #c9cfe0; line-height: 1.5; margin: 0 0 22px; }
        button {
            font: inherit;
            font-weight: 700;
            border: 0;
            border-radius: 999px;
            padding: 12px 28px;
            min-height: 48px;
            background: #e8b93a;
            color: #1f2433;
            cursor: pointer;
        }
    </style>
</head>
<body>
<main>
    <svg viewBox="0 0 64 64" aria-hidden="true">
        <polygon points="32,8 52,50 12,50" fill="#268c58"/>
        <rect x="28" y="50" width="8" height="8" rx="1" fill="#784828"/>
        <circle cx="26" cy="38" r="2.6" fill="#d63a50"/>
        <circle cx="37" cy="31" r="2.6" fill="#e8b93a"/>
        <circle cx="38" cy="44" r="2.6" fill="#f6d27a"/>
        <polygon points="32,1 34,6 39,6 35,9 36.5,14 32,11 27.5,14 29,9 25,6 30,6" fill="#e8b93a"/>
    </svg>
    <h1>You're offline</h1>
    <p>{{ site_name }} needs an internet connection. Check your Wi-Fi or signal, then try again.</p>
    <button type="button" id="retry">Try again</button>
</main>
<script>document.getElementById('retry').addEventListener('click', () => location.reload());</script>
</body>
</html>
