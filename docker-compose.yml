# One container: web app + daily reminders, data in a SQLite file.
#
#   docker compose up -d
#
# Then open http://YOUR-SERVER-IP:8123 and create the admin account with the
# setup code from:  docker compose logs wishlist
#
# On Unraid you'd normally install it from Community Apps instead; this file is
# for other Docker hosts (or building it yourself).

services:
  wishlist:
    image: ghcr.io/redrob2/christmas-app:latest
    # build: .        # uncomment to build from this folder instead
    container_name: wishlist
    ports:
      - "8123:8123"
    environment:
      - TZ=America/New_York
      - PUID=99
      - PGID=100
      # Address people use to reach it (for links in emails and notifications;
      # phones can only install the app and get notifications over https)
      - PUBLIC_URL=https://wishlist.example.com
      # true when people come in through a reverse proxy (it then trusts X-Forwarded-For)
      - TRUST_PROXY=false
      # Email (optional, but needed for invites, reminders and password resets)
      - MAIL_SERVER=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USE_TLS=true
      - MAIL_USERNAME=
      - MAIL_PASSWORD=
      - MAIL_DEFAULT_SENDER=
      # Optional AI features (link lookups, photo characters, gift poems)
      - GEMINI_API_KEY=
      - REMINDER_HOUR=9
      # Optional: use PostgreSQL instead of the built-in SQLite file
      # - DATABASE_URL=postgresql://user:password@postgres-host:5432/wishlist
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
